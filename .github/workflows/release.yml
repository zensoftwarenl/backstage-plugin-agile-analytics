name: Release

# Semantic versioning with Changesets. Every PR that changes a package adds a
# changeset (`yarn changeset`) saying whether it is a major, minor or patch
# change. On every push to main:
#
# 1. With changesets pending, this opens or updates the "Version Packages"
#    PR, which bumps the shared version and writes the CHANGELOGs.
# 2. Once that PR is merged, the new version is not on npm yet, so the
#    publish job runs: after approval in the `npm` environment it publishes
#    the three packages with provenance, tags vX.Y.Z and creates a GitHub
#    release.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version Packages PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # to start CI on the Version Packages PR
    outputs:
      unpublished: ${{ steps.unpublished.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Open or update the Version Packages PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: yarn version-packages
          title: Version Packages
          commit: Version Packages

      # PRs opened with the GITHUB_TOKEN don't trigger pull_request
      # workflows, so start the required checks on the PR's branch here
      - name: Run CI on the Version Packages PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main

      - name: Find a version that is not on npm yet
        id: unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/unpublished-version.js >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    environment: npm # requires approval before anything is published
    permissions:
      contents: write # tag and GitHub release
      id-token: write # npm provenance
    env:
      VERSION: ${{ needs.version.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          registry-url: https://registry.npmjs.org

      - run: yarn install --frozen-lockfile
      - run: yarn tsc
      - run: yarn lint:all
      - run: yarn check:zen
      - run: yarn test:all
      - run: yarn build
      - run: yarn pack:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        # Skips versions that are already on npm, so this can be re-run
        run: yarn changeset publish --no-git-tag

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.js "$VERSION" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
          fi
