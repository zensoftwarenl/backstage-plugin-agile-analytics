name: Publish to npm

# Push a tag vX.Y.Z (matching the version of all three packages) to publish
# them. See AGENTS.md for the release steps.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in plugins/*/package.json; do
            version=$(node -p "require('./$pkg').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version, the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: yarn install --frozen-lockfile
      - run: yarn tsc
      - run: yarn lint:all
      - run: yarn check:zen
      - run: yarn test:all
      - run: yarn build
      - run: yarn pack:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Prereleases (2.1.0-rc.0) go to the next dist-tag
          dist_tag=latest
          case "$tag" in *-*) dist_tag=next ;; esac
          # Dependencies first
          for dir in agile-analytics-common agile-analytics-backend agile-analytics; do
            name=$(node -p "require('./plugins/$dir/package.json').name")
            if npm view "$name@$tag" version >/dev/null 2>&1; then
              echo "$name@$tag is already published, skipping"
              continue
            fi
            (cd "plugins/$dir" && npm publish --provenance --access public --tag "$dist_tag")
          done
